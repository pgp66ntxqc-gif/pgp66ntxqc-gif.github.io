    function renderHistory() {
      if (!state.history.length) {
        el.historyList.innerHTML = `<div class="history-row"><strong>暂无记录</strong><span>开始一轮</span></div>`;
        return;
      }
      el.historyList.innerHTML = `
        ${state.history.slice(0, 8).map((item) => {
          const config = MODE_CONFIG[item.mode] || MODE_CONFIG.compare;
          return `
            <div class="history-row">
              <strong>${config.label} · ${item.accuracy}%</strong>
              <span>${formatDate(item.date)}</span>
            </div>
          `;
        }).join("")}
        <button class="ghost-action danger-action" data-action="clear-history">清空记录</button>
      `;
    }

    function renderGoals() {
      const goals = {
        identify: bestAccuracy("identify"),
        compare: bestAccuracy("compare"),
        memory: bestAccuracy("memory"),
        voids: bestAccuracy("voids"),
        battle: bestAccuracy("battle")
      };
      setGoal(el.goalIdentifyText, el.goalIdentifyBar, goals.identify);
      setGoal(el.goalCompareText, el.goalCompareBar, goals.compare);
      setGoal(el.goalMemoryText, el.goalMemoryBar, goals.memory);
      setGoal(el.goalVoidText, el.goalVoidBar, goals.voids);
      setGoal(el.goalBattleText, el.goalBattleBar, goals.battle);
    }

    function setGoal(textEl, barEl, value) {
      textEl.textContent = `${value}%`;
      barEl.style.setProperty("--value", `${Math.min(100, value)}%`);
    }

    function submitCompare(answer) {
      const q = state.question;
      const correct = answer === q.answer;
      const userText = answer === "left" ? "左手更大" : "右手更大";
      const expectedText = q.answer === "left" ? "左手更大" : "右手更大";
      recordAnswer({
        correct,
        score: correct ? 100 : 0,
        correctCount: correct ? 1 : 0,
        totalCount: 1,
        message: `${q.explanation} ${q.rule}`,
        answerKey: expectedText,
        coach: "先确认两边是不是同牌型，再只抓一个关键点：对子看对子点数，夯看三张点数，顺子看最大张，炸弹看头数和点数。",
        breakdown: [{ label: q.title, user: userText, expected: expectedText, ok: correct }]
      });
    }

    function submitIdentify() {
      const inputs = [...document.querySelectorAll("[data-identify-key]")];
      let correctFields = 0;
      const parts = [];
      const misses = [];
      const breakdown = [];

      for (const input of inputs) {
        const key = input.dataset.identifyKey;
        const field = IDENTIFY_FIELDS.find((item) => item.key === key);
        const raw = input.value.trim();
        const answer = raw === "" ? Number.NaN : Number(raw);
        const expected = state.question.expected[key];
        if (answer === expected) correctFields += 1;
        else misses.push(field.label);
        breakdown.push({
          label: field.label,
          user: Number.isNaN(answer) ? "未填" : `${answer}${field.unit}`,
          expected: `${expected}${field.unit}`,
          ok: answer === expected
        });
        parts.push(`${field.label} ${expected}${field.unit}`);
      }

      const correct = correctFields === IDENTIFY_FIELDS.length;
      const score = Math.round((correctFields / IDENTIFY_FIELDS.length) * 100);
      const message = correct
        ? "牌型结构统计完全正确。"
        : `你答对 ${correctFields} 项，答错 ${IDENTIFY_FIELDS.length - correctFields} 项。重点复盘：${misses.join("、")}。`;
      recordAnswer({
        correct,
        score,
        correctCount: correctFields,
        totalCount: IDENTIFY_FIELDS.length,
        message,
        answerKey: parts.join("，"),
        coach: "理牌顺序建议固定：先找四张以上炸弹，再找同花连续五张，然后找普通顺子，最后数三张、对子、孤张。顺序固定后，速度自然会上来。",
        breakdown
      });
    }

    function toggleRank(rank) {
      if (state.selectedRanks.has(rank)) state.selectedRanks.delete(rank);
      else state.selectedRanks.add(rank);
      render();
    }

    function submitVoids() {
      const expected = new Set(state.question.expected);
      const selected = state.selectedRanks;
      const missed = [...expected].filter((rank) => !selected.has(rank));
      const extra = [...selected].filter((rank) => !expected.has(rank));
      const correctSelected = [...selected].filter((rank) => expected.has(rank));
      const correct = missed.length === 0 && extra.length === 0;
      const penalty = (missed.length + extra.length) * 22;
      const score = Math.max(0, 100 - penalty);
      const expectedText = state.question.expected.length ? state.question.expected.join("、") : "无断张";
      const detail = correct ? "断张识别完全正确。" : `标准断张：${expectedText}。漏选 ${missed.length} 个，多选 ${extra.length} 个。`;
      const breakdown = [
        { label: "正确选中", user: correctSelected.length ? correctSelected.join("、") : "无", expected: "属于断张", ok: true },
        { label: "漏选", user: missed.length ? missed.join("、") : "无", expected: "应选出来", ok: missed.length === 0 },
        { label: "多选", user: extra.length ? extra.join("、") : "无", expected: "不应选择", ok: extra.length === 0 }
      ];
      recordAnswer({
        correct,
        score,
        correctCount: expected.size - missed.length,
        totalCount: Math.max(expected.size, 1),
        message: detail,
        answerKey: `本题断张：${expectedText}`,
        coach: "看断张时不要逐张背牌，按点数扫一遍：3 到 A、再看 2。先标 10 以上断张，因为它们更影响炸弹和冲刺防守。",
        breakdown
      });
    }

    function startMemoryReveal() {
      const q = state.question;
      q.phase = "watching";
      q.cursor = 0;
      render();
      clearInterval(state.memoryTimerId);
      state.memoryTimerId = setInterval(() => {
        if (!state.question || state.question.type !== "memory") return;
        state.question.cursor += 1;
        if (state.question.cursor >= state.question.revealed.length) {
          showMemoryInputs();
          return;
        }
        renderMemory();
      }, 620);
    }

    function showMemoryInputs() {
      clearInterval(state.memoryTimerId);
      if (!state.question) return;
      state.question.phase = "answering";
      state.questionStartedAt = performance.now();
      render();
    }

    function submitMemory() {
      const inputs = [...document.querySelectorAll("[data-memory-key]")];
      let correctFields = 0;
      const parts = [];
      const breakdown = [];
      for (const input of inputs) {
        const key = input.dataset.memoryKey;
        const label = state.question.focus.find((item) => item.key === key).label;
        const raw = input.value.trim();
        const answer = raw === "" ? Number.NaN : Number(raw);
        const expected = state.question.expected[key];
        if (answer === expected) correctFields += 1;
        breakdown.push({
          label,
          user: Number.isNaN(answer) ? "未填" : `${answer}张`,
          expected: `${expected}张`,
          ok: answer === expected
        });
        parts.push(`${label} ${expected}`);
      }
      const correct = correctFields === inputs.length;
      const score = Math.round((correctFields / inputs.length) * 100);
      recordAnswer({
        correct,
        score,
        correctCount: correctFields,
        totalCount: inputs.length,
        message: correct ? "核心大牌剩余张数全部正确。" : `你答对 ${correctFields} 项，答错 ${inputs.length - correctFields} 项。标准答案：${parts.join("，")}。`,
        answerKey: parts.join("，"),
        coach: "记牌时只开一个小账本：王、2、级牌、A、K。看到一张就在脑子里减一，不要同时试图记所有小牌。",
        breakdown
      });
    }

    function submitBattle(answer) {
      const q = state.question;
      const correct = answer === q.answer;
      const picked = q.choices.find(([value]) => value === answer);
      const expected = q.choices.find(([value]) => value === q.answer);
      recordAnswer({
        correct,
        score: correct ? 100 : 35,
        correctCount: correct ? 1 : 0,
        totalCount: 1,
        message: `${correct ? "选择合理" : `你的选择是“${picked ? picked[1] : "未知动作"}”`}。${q.explanation}`,
        answerKey: expected ? expected[1] : "无",
        coach: "模拟对战先按三步想：谁快跑完、队友需不需要我接、能不能不用炸弹解决。只有同牌型接不住且局势关键时，再动炸弹。",
        breakdown: [{
          label: q.title,
          user: picked ? picked[1] : "未知动作",
          expected: expected ? expected[1] : "无",
          ok: correct
        }]
      });
    }

    function submitSelectedMatchCards() {
      const match = state.question.match;
      const play = selectedMatchPlay(match);
      const recommended = recommendedMatchAction(match);
      const selectedText = state.selectedMatchCards.size ? `${state.selectedMatchCards.size} 张牌` : "未选牌";

      if (!play) {
        recordAnswer({
          correct: false,
          score: 20,
          correctCount: 0,
          totalCount: 1,
          message: "当前选牌还不能组成首版支持的牌型。",
          answerKey: recommended ? `${recommended.label}${recommended.play ? `：${recommended.play.label}` : ""}` : "暂无推荐动作",
          coach: "实战轮转当前支持单张、对子、5 张顺子和炸弹。先点选能组成这些牌型的牌，再出牌。",
          breakdown: [{ label: "选中牌", user: selectedText, expected: "单张 / 对子 / 顺子 / 炸弹", ok: false }],
          continueMatch: true
        });
        return;
      }

      if (play.invalid) {
        recordAnswer({
          correct: false,
          score: 30,
          correctCount: 0,
          totalCount: 1,
          message: "这手牌型成立，但压不过桌面当前牌。",
          answerKey: recommended ? `${recommended.label}${recommended.play ? `：${recommended.play.label}` : ""}` : "暂无推荐动作",
          coach: "先看桌面牌型：同牌型要更大才能接；如果桌面是炸弹，只能用更大的炸弹接。",
          breakdown: [{ label: "选中牌", user: play.label, expected: "能压过桌面牌", ok: false }],
          continueMatch: true
        });
        return;
      }

      const user = userSeat(match);
      const samePlan = recommended?.key === play.type;
      const samePower = !recommended?.play || recommended.play.power === play.power;
      const correct = Boolean(samePlan && samePower);
      const score = correct ? 100 : samePlan ? 82 : 62;
      applyPlay(match, user, play);
      state.selectedMatchCards = new Set();
      advanceAiTurns(match);
      const finished = match.finished || state.answers.length + 1 >= state.total;
      if (finished) state.index = state.total;
      recordAnswer({
        correct,
        score,
        correctCount: correct ? 1 : 0,
        totalCount: 1,
        message: correct ? "这手选牌和推荐节奏一致。" : "这手牌可以出，但不是当前最稳的节奏。",
        answerKey: recommended ? `${recommended.label}${recommended.play ? `：${recommended.play.label}` : ""}` : "暂无推荐动作",
        coach: "点选出牌时，先追求“刚好能接、少浪费牌力”。能用对子接就别炸，能用小牌拿下就别交大牌。",
        breakdown: [{
          label: "选中出牌",
          user: play.label,
          expected: recommended ? `${recommended.label}${recommended.play ? `：${recommended.play.label}` : ""}` : "无",
          ok: correct
        }],
        continueMatch: !finished
      });
    }

    function submitMatchAction(actionKey) {
      const match = state.question.match;
      const actions = availableUserActions(match);
      const action = actions.find((item) => item.key === actionKey);
      const recommended = recommendedMatchAction(match);
      const user = userSeat(match);
      let correct = actionKey === recommended?.key;
      let score = correct ? 100 : 55;
      let message = "";

      if (!action) return;
      if (actionKey === "pass" && !match.tablePlay) {
        correct = false;
        score = 20;
        message = "你当前先手，不能过牌。先出小单、对子或顺子建立牌权。";
      } else if (actionKey !== "pass" && !action.play) {
        correct = false;
        score = 25;
        message = "这个牌型当前出不了，可能是手里没有，或者压不过桌面牌。";
      } else {
        applyPlay(match, user, actionKey === "pass" ? null : action.play);
        state.selectedMatchCards = new Set();
        advanceAiTurns(match);
        message = correct
          ? "这步节奏合理。"
          : `这步可以走，但更推荐“${recommended ? recommended.label : "过牌"}”。`;
      }

      const finished = match.finished || state.answers.length + 1 >= state.total;
      if (finished) state.index = state.total;
      recordAnswer({
        correct,
        score,
        correctCount: correct ? 1 : 0,
        totalCount: 1,
        message,
        answerKey: recommended ? `${recommended.label}${recommended.play ? `：${recommended.play.label}` : ""}` : "暂无推荐动作",
        coach: match.finished
          ? `${match.winner} 已先出完。下一步可以复盘你是否过早动炸弹、是否帮队友保留了牌权。`
          : "实战轮转先抓三件事：自己能不能自然接、队友是否在走牌、对手是否快冲刺。不要只看自己一手牌漂亮不漂亮。",
        breakdown: [{
          label: "本轮动作",
          user: action.label,
          expected: recommended ? recommended.label : "无",
          ok: correct
        }],
        continueMatch: !finished
      });
    }

    function continueMatch() {
      clearTimers();
      state.lastFeedback = null;
      state.selectedMatchCards = new Set();
      if (!state.question || state.question.type !== "battle-match" || state.question.match.finished || state.answers.length >= state.total) {
        finishSession();
        return;
      }
      state.index = Math.min(state.answers.length + 1, state.total);
      state.questionStartedAt = performance.now();
      startQuestionTimer();
      render();
    }

    function recordAnswer(result) {
      const elapsedMs = Math.round(performance.now() - state.questionStartedAt);
      const answer = {
        mode: state.mode,
        correct: result.correct,
        score: result.score,
        elapsedMs,
        correctCount: result.correctCount ?? (result.correct ? 1 : 0),
        totalCount: result.totalCount ?? 1
      };
      state.answers.push(answer);
      state.lastFeedback = {
        correct: result.correct,
        score: result.score,
        elapsedMs,
        message: result.message,
        correctCount: result.correctCount ?? (result.correct ? 1 : 0),
        totalCount: result.totalCount ?? 1,
        answerKey: result.answerKey || "",
        coach: result.coach || "先把规则判断拆成固定步骤，再追求速度。",
        breakdown: result.breakdown || [],
        continueMatch: Boolean(result.continueMatch)
      };
      clearTimers();
      render();
    }

    function summarizeAnswers(answers) {
      if (!answers.length) return { totalScore: 0, accuracy: 0, avgScore: 0, avgMs: 0, questionCorrect: 0, questionTotal: 0 };
      const totalScore = answers.reduce((sum, item) => sum + item.score, 0);
      const correct = answers.filter((item) => item.correct).length;
      const avgMs = Math.round(answers.reduce((sum, item) => sum + item.elapsedMs, 0) / answers.length);
      return {
        totalScore,
        accuracy: Math.round((correct / answers.length) * 100),
        avgScore: Math.round(totalScore / answers.length),
        avgMs,
        questionCorrect: correct,
        questionTotal: answers.length
      };
    }

    function sessionCoach(summary) {
      if (summary.questionTotal === 0) return "先完成一轮训练，再看复盘建议。";
      if (summary.accuracy >= 90) return "这一轮很稳，可以把题量加到 10 题，或者进入模拟对战，把规则反应迁移到实战决策。";
      if (summary.accuracy >= 70) return "基础方向对了。下一轮别急着提速，优先复盘错题里的共同点，尤其是漏数、误判关键张、过早动炸弹。";
      return "先降速练准确率。每题按固定顺序判断：看牌型、找关键张、确认队友/对手状态，再提交答案。";
    }

    function bestAccuracy(mode) {
      const candidates = state.history.filter((item) => item.mode === mode).map((item) => item.accuracy);
      if (state.mode === mode && state.answers.length) candidates.push(summarizeAnswers(state.answers).accuracy);
      return candidates.length ? Math.max(...candidates) : 0;
    }

    function startQuestionTimer() {
      updateTimer();
      state.timerId = setInterval(updateTimer, 200);
    }

    function updateTimer() {
      if (!state.active || state.lastFeedback || !state.questionStartedAt) return;
      const elapsed = (performance.now() - state.questionStartedAt) / 1000;
      el.timerChip.textContent = `${elapsed.toFixed(1)}s`;
    }

    function clearTimers() {
      clearInterval(state.timerId);
      clearInterval(state.memoryTimerId);
      state.timerId = null;
      state.memoryTimerId = null;
    }

    function loadHistory() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (error) {
        return [];
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.history));
    }

    function clearHistory() {
      state.history = [];
      saveHistory();
      render();
    }

    function formatDate(value) {
      const date = new Date(value);
      return `${String(date.getMonth() + 1).padStart(2, "0")}/${String(date.getDate()).padStart(2, "0")} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
    }

    function cssSafe(value) {
      return value.replace(/[^a-z0-9_-]/gi, "-");
    }

    init();
  </script>
</body>
</html>
